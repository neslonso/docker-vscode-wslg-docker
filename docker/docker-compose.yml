# ============================================================================
# Base Docker Compose Configuration
# ============================================================================
# This file contains the common configuration shared across all modes.
# Mode-specific settings are defined in override files:
#
# Docker mode (pick one):
#   - docker-compose.dind.yml (Docker-in-Docker)
#   - docker-compose.dood.yml (Docker-out-of-Docker)
#
# Display mode (pick one, auto-detected by vsc-wslg launcher):
#   - docker-compose.wslg.yml (WSL2 with WSLg)
#   - docker-compose.x11.yml  (Native Linux X11, e.g. Ubuntu + XFCE)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dind.yml -f docker-compose.wslg.yml up
#   docker compose -f docker-compose.yml -f docker-compose.dood.yml -f docker-compose.x11.yml up

services:
  vscode:
    build:
      context: ..
      dockerfile: docker/Dockerfile.base
    hostname: "${CONTAINER_HOSTNAME:-vsc-wslg}"
    shm_size: '1gb'
    environment:
      - DISPLAY
      - PULSE_SERVER
      - VSCODE_EXTENSIONS_PROFILE
      - BROWSER=firefox-esr
      - WORKSPACE_PATH=/workspaces/${WORKSPACE_NAME}
    volumes:
      # Project workspace (mounted with original directory name)
      - ${PROJECT_DIR}:/workspaces/${WORKSPACE_NAME}

      # VSCode profile (read-only)
      - ${PROFILE_DIR}:/home/dev/vsc-wslg-${VSCODE_EXTENSIONS_PROFILE}-profile:ro

      # X11 display socket (common to WSLg and native X11)
      - /tmp/.X11-unix:/tmp/.X11-unix

      # VSCode persistent data
      - vscode-extensions:/home/dev/.vscode
      - vscode-config:/home/dev/.config/Code

      # Shell persistence (.bash_history, .bashrc, .bash_aliases)
      - shell-persist:/home/dev/.shell_persist
    restart: "no"

volumes:
  # VSCode extensions and configuration (shared across modes)
  vscode-extensions:
  vscode-config:
  # Shell files persistence across container recreations
  shell-persist:
