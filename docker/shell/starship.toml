# Starship prompt - Pastel Powerline (multi-line)
#
# Line 1: user  host  directory  git  languages
# Line 2: time  duration  prompt char

format = """\
[](fg:#7aa2f7)\
$username\
[](fg:#7aa2f7 bg:#e0af68)\
$hostname\
[](fg:#e0af68 bg:#9ece6a)\
$directory\
[](fg:#9ece6a bg:#bb9af7)\
$git_branch\
$git_status\
[](fg:#bb9af7 bg:#7dcfff)\
$python\
$nodejs\
$php\
$rust\
$java\
$golang\
$docker_context\
[](fg:#7dcfff)\
$fill\
$cmd_duration\
$line_break\
[](fg:#565f89)\
$time\
[](fg:#565f89)\
$character"""

# ─── Line 1 segments ─────────────────────────────────────────────

[username]
show_always = true
format = "[ $user ]($style)"
style_user = "fg:#1a1b26 bg:#7aa2f7 bold"
style_root = "fg:#1a1b26 bg:#f7768e bold"

[hostname]
ssh_only = false
format = "[ $hostname ]($style)"
style = "fg:#1a1b26 bg:#e0af68 bold"

[directory]
format = "[ $path ]($style)"
style = "fg:#1a1b26 bg:#9ece6a bold"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $symbol$branch ]($style)"
symbol = " "
style = "fg:#1a1b26 bg:#bb9af7 bold"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "fg:#1a1b26 bg:#bb9af7"
conflicted = " "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
stashed = "📦 "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[python]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:#1a1b26 bg:#7dcfff"

[nodejs]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:#1a1b26 bg:#7dcfff"

[php]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:#1a1b26 bg:#7dcfff"

[rust]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:#1a1b26 bg:#7dcfff"

[java]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:#1a1b26 bg:#7dcfff"

[golang]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:#1a1b26 bg:#7dcfff"

[docker_context]
format = "[ $symbol$context ]($style)"
symbol = " "
style = "fg:#1a1b26 bg:#7dcfff"

# ─── Fill (spaces between left and right) ─────────────────────────

[fill]
symbol = " "

# ─── Right-aligned / Line 1 tail ─────────────────────────────────

[cmd_duration]
min_time = 2_000
format = " [took $duration]($style)"
style = "fg:#565f89 italic"

# ─── Line 2 ──────────────────────────────────────────────────────

[time]
disabled = false
format = "[ $time ]($style)"
time_format = "%d/%m %H:%M:%S"
style = "fg:#a9b1d6 bg:#565f89"

[character]
success_symbol = " [❯](fg:#9ece6a bold)"
error_symbol = " [❯](fg:#f7768e bold)"
