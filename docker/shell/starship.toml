# Starship prompt — Pastel Powerline (multi-line)
#
# Line 1:  user   host   ~/workspaces/proj   main ✚   v20 ...
# Line 2:  16/02 21:30  ❯
#
# Requires a Nerd Font (FiraCode NF is installed in the image)

format = """
[](color_purple)\
$os\
$username\
[](fg:color_purple bg:color_rose)\
$hostname\
[](fg:color_rose bg:color_green)\
$directory\
[](fg:color_green bg:color_lavender)\
$git_branch\
$git_status\
[](fg:color_lavender bg:color_sky)\
$c\
$python\
$nodejs\
$php\
$rust\
$java\
$golang\
$kotlin\
[](fg:color_sky bg:color_teal)\
$docker_context\
[](fg:color_teal)\
$fill\
$cmd_duration\
$line_break\
[](fg:color_muted)\
$time\
[](fg:color_muted) \
$character"""

# ─── Palette ─────────────────────────────────────────────────────

palette = "pastel"

[palettes.pastel]
color_fg      = "#1e1e2e"     # dark text on colored bg
color_fg_soft = "#cdd6f4"     # light text on dark bg
color_purple  = "#cba6f7"     # mauve  — user
color_rose    = "#f5a97f"     # peach  — host
color_green   = "#a6e3a1"     # green  — directory
color_lavender= "#b4befe"     # lavender — git
color_sky     = "#89dceb"     # sky    — languages
color_teal    = "#94e2d5"     # teal   — docker
color_muted   = "#585b70"     # surface2 — time bg
color_ok      = "#a6e3a1"     # green  — success char
color_err     = "#f38ba8"     # red    — error char
color_warn    = "#f9e2af"     # yellow — vim replace

# ─── Line 1 segments ─────────────────────────────────────────────

[os]
disabled = false
style = "fg:color_fg bg:color_purple bold"

[os.symbols]
Debian = "󰣚 "
Linux  = "󰌽 "
Ubuntu = "󰕈 "
Arch   = "󰣇 "
Windows = "󰍲 "
Macos  = "󰀵 "

[username]
show_always = true
format = "[ $user ]($style)"
style_user = "fg:color_fg bg:color_purple bold"
style_root = "fg:color_fg bg:color_err bold"

[hostname]
ssh_only = false
format = "[  $hostname ]($style)"
style = "fg:color_fg bg:color_rose bold"

[directory]
format = "[ $path ]($style)"
style = "fg:color_fg bg:color_green bold"
truncation_length = 4
truncation_symbol = "…/"
read_only = " 󰌾"

[directory.substitutions]
# Order matters — longer/more specific first
"/workspaces" = " "
"Documents" = "󰈙 "
"Downloads" = " "
"~" = " "

[git_branch]
symbol = ""
format = "[ $symbol $branch ]($style)"
style = "fg:color_fg bg:color_lavender bold"

[git_status]
format = "[($all_status$ahead_behind )]($style)"
style = "fg:color_fg bg:color_lavender"
conflicted = "  "
ahead     = " ⇡${count}"
behind    = " ⇣${count}"
diverged  = " ⇕⇡${ahead_count}⇣${behind_count}"
untracked = " ?"
stashed   = " 󰏗"
modified  = " !"
staged    = " +"
renamed   = " »"
deleted   = " ✘"

[c]
symbol = " "
format = '[[ $symbol($version) ](fg:color_fg bg:color_sky)]($style)'
style = "bg:color_sky"

[python]
symbol = " "
format = '[[ $symbol($version) ](fg:color_fg bg:color_sky)]($style)'
style = "bg:color_sky"

[nodejs]
symbol = " "
format = '[[ $symbol($version) ](fg:color_fg bg:color_sky)]($style)'
style = "bg:color_sky"

[php]
symbol = " "
format = '[[ $symbol($version) ](fg:color_fg bg:color_sky)]($style)'
style = "bg:color_sky"

[rust]
symbol = " "
format = '[[ $symbol($version) ](fg:color_fg bg:color_sky)]($style)'
style = "bg:color_sky"

[java]
symbol = " "
format = '[[ $symbol($version) ](fg:color_fg bg:color_sky)]($style)'
style = "bg:color_sky"

[golang]
symbol = " "
format = '[[ $symbol($version) ](fg:color_fg bg:color_sky)]($style)'
style = "bg:color_sky"

[kotlin]
symbol = " "
format = '[[ $symbol($version) ](fg:color_fg bg:color_sky)]($style)'
style = "bg:color_sky"

[docker_context]
symbol = " "
format = '[[ $symbol$context ](fg:color_fg bg:color_teal)]($style)'
style = "bg:color_teal"

# ─── Fill ─────────────────────────────────────────────────────────

[fill]
symbol = " "

# ─── Right side of line 1 ────────────────────────────────────────

[cmd_duration]
min_time = 2_000
format = "  [󱎫 $duration]($style)"
style = "fg:color_muted italic"

# ─── Line 2 ──────────────────────────────────────────────────────

[time]
disabled = false
format = "[  $time ]($style)"
time_format = "%d/%m %H:%M:%S"
style = "fg:color_fg_soft bg:color_muted"

[character]
success_symbol = "[❯](fg:color_ok bold)"
error_symbol = "[❯](fg:color_err bold)"
vimcmd_symbol = "[❮](fg:color_ok bold)"
vimcmd_replace_one_symbol = "[❮](fg:color_warn bold)"
vimcmd_replace_symbol = "[❮](fg:color_warn bold)"
